# ================================ Configurations ================================

DEVICE_CODE="nabu"                     #   Device codename (ensure this matches your device)
WIN_MIN_SIZE=30                        #   Minimum required size for Windows partition (in GB)
ESP_MIN_SIZE=349                       #   Minimum required size for ESP partition (in MB)
REQUIRED_BATTERY=50                    #   Minimum battery percentage required to proceed with the installation
WIN_PART_NAME="WINNABU"                #   Label/name for the Windows partition to be used during formatting
ESP_PART_NAME="ESPNABU"                #   Label/name for the ESP partition to be used during formatting in WinPE
SECURE_BOOT="TRUE"                     #   Set to "FALSE" if the UEFI does not support secure boot
WINDOWS_EDITIONS=(
  "Windows 11 Pro"
  "Windows 11 IoT Enterprise LTSC"
  "Windows 11 Enterprise LTSC"
  "Windows 11 Enterprise"
  "Windows 11 Home"
  "Windows 10 Pro"
  "Windows 10 Home"
)                                      #  Priority-ordered list of supported Windows editions.
DEVICE_NAME="Xiaomi Pad 5"             #  Name of the device
WI_VERSION="WinInstaller_Nabu_R8.3.2"  #  Version-device for the WinInstaller
BUILD_DATE="16-Jun-2025"                #  Build date of the installer
MAINTAINER="Project-Aloha,map220v,remtrik And idk"
# ============================== Configurations End ==============================
